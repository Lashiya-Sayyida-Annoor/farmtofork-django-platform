{% extends 'Farmer/Header.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Profile</title>
    <style>
        .card {
            background-color: #fff;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
            transition: 0.3s;
            width: 300px;
            margin: auto;
            padding: 20px;
            margin-top: 50px;
            border-radius: 10px;
        }
        .card:hover {
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
        }
        .container {
            padding: 16px;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 14px 18px;
            margin: 10px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="container">
            <center>
                <h1>Profile</h1>
                <form action="" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <table border="0">
                        <tr>
                            <td colspan="2"><img src="{{farmer.farmer_photo}}" height="100px" width="170px"></td>
                        </tr>
                        <tr>
                            <td>Name:</td>
                            <td><input type="text" name="txtname" id="" value="{{farmer.farmer_name}}"></td>
                        </tr>
                        <tr>
                            <td>Contact:</td>
                            <td><input type="text" name="txtcontact" id="" value="{{farmer.farmer_contact}}"></td>
                        </tr>
                        <tr>
                            <td>Profile Picture:</td>
                            <td><input type="file" name="file_photo" id="file_photo" value="{{farmer.farmer_photo}}"></td>
                        </tr>
                        <tr> 
                            <td colspan="2" align="center"><input type="submit" name="btnsub" value="Update"></td>
                        </tr>
                    </table>
                </form>
            </center>
        </div>
    </div>
</body>
</html>

{% endblock content %}
