{% extends 'Admin/Header.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div class="container">
        <form action="" method="post">
            {% csrf_token %}
            <!-- Form to add/edit district -->
            <div class="row justify-content-center">
                <div class="col-md-6">
                   <br><br><h1>DISTRICTS</h1><br>

                    <table class="table table-bordered" align="right">
                        <tr>
                            <td>District</td>
                            <td><input type="text" class="form-control" name="txtdist" id="txtdist" value="{{disdata.district_name}}"></td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center"><input type="submit" class="btn btn-primary" value="Save" name="btnsub"></td>
                        </tr>
                    </table>
                </div>
            </div>

            <!-- Table to display existing districts -->
            <div class="row justify-content-center mt-4">
                <div class="col-md-8">
                    <table class="table table-striped table-bordered">
                        <thead class="thead-dark">
                            <tr>
                                <th>SI No</th>
                                <th>District</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for i in district %}
                            <tr>
                                <td>{{forloop.counter}}</td>
                                <td>{{i.dis.district_name}}</td>
                                <td>
                                    <a href="{% url 'webadmin:delete_dis' i.id %}" class="btn btn-danger">Delete</a>
                                    <a href="{% url 'webadmin:edit_dis' i.id %}" class="btn btn-warning">Edit</a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </form>
    </div>

</body>
</html>

{% endblock content %}
