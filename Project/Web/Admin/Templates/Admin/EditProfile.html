{% extends 'Admin/Header.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <center>
            <h1>Admin Profile</h1>
            <form action="" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <div class="text-center">
                                    <img src="{{admin.admin_photo}}" class="img-fluid rounded-circle" alt="Profile Image" style="width: 200px; height: 200px;">
                                </div>
                                <div class="form-group mt-3">
                                    <label for="txtname">Name:</label>
                                    <input type="text" class="form-control" name="txtname" id="txtname" value="{{admin.admin_name}}">
                                </div>
                                <div class="form-group">
                                    <label for="txtcontact">Contact:</label>
                                    <input type="text" class="form-control" name="txtcontact" id="txtcontact" value="{{admin.admin_contact}}">
                                </div>
                                <div class="form-group">
                                    <label for="file_photo">Profile Picture:</label>
                                    <input type="file" class="form-control-file" name="file_photo" id="file_photo">
                                </div>
                                <div class="text-center">
                                    <input type="submit" class="btn btn-primary" name="btnsub" value="Update">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </center>
    </div>

    <!-- Bootstrap JS and jQuery (Optional, if you need JavaScript functionality) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
{% endblock content %}
