{% extends 'Admin/Header.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        .profile-card {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        .profile-img {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 20px;
        }
        .profile-img img {
            width: 100%;
            height: 100%;
        }
        .profile-details td {
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <center>
                <div class="profile-img">
                    <img src="{{admin.admin_photo }}" alt="Profile Image">
                </div>
                <h1>{{admin.admin_name}}</h1>
            </center>
            <table class="table profile-details">
                <tr>
                    <td><strong>Email:</strong></td>
                    <td>{{admin.admin_email}}</td>
                </tr>
                <tr>
                    <td><strong>Contact:</strong></td>
                    <td>{{admin.admin_contact}}</td>
                </tr>
                <tr> 
                    <td colspan="2" align="center">
                        <a href="{% url 'webadmin:editaprofile' %}" class="btn btn-primary">Edit Profile</a>
                        <a href="{% url 'webadmin:editaprofile' %}" class="btn btn-primary">Change Password</a>

                    </td>
                </tr>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS and jQuery (Optional, if you need JavaScript functionality) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
{% endblock content %}
