{% extends 'Admin/Header.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <form action="" method="post">
            {% csrf_token %}
            <!-- Form to add/edit category -->
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <br><center><h1 style="color: #1564b3">CATEGORY</h1><br>
                    <table class="table table-bordered" style="color: #1564b3">
                        <tr>
                            <td>Category</td>
                            <td><input type="text" class="form-control" name="txtcat" id="txtcat" value="{{catdata.category_name}}"></td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center"><input type="submit" class="btn btn-primary" value="Save" name="btnsub"></td>
                        </tr>
                    </table>
                </div>
            </div>

            <!-- Table to display existing categories -->
            <div class="row justify-content-center mt-4">
                <div class="col-md-8">
                    <table class="table table-striped table-bordered" style="color: #1564b3">
                        <thead class="thead-dark">
                            <tr>
                                <th>SI No</th>
                                <th>Category</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for i in category %}
                            <tr>
                                <td>{{forloop.counter}}</td>
                                <td>{{i.cat.category_name}}</td>
                                <td>
                                    <a href="{% url 'webadmin:delete_cat' i.id %}" class="btn btn-danger">Delete</a>
                                    <a href="{% url 'webadmin:edit_cat' i.id %}" class="btn btn-warning">Edit</a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS and jQuery (Optional, if you need JavaScript functionality) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
{% endblock content %}
