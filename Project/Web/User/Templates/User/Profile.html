{% extends 'User/Header.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
</head>
<body>
    <center>
    <h1> Profile</h1>

      <form action="" method="post">
        
            {% csrf_token %}
            <table border="2">
                <tr>
                    <td colspan="2" ><img src="{{user.image }}" height="100px" width="170px"></td>
                    </tr>
                <tr>
                    <td>Name</td>
                <td>{{user.name}}</td>
                </tr>
                <tr>
                    <td>Email</td>
                <td>{{user.email}}</td>
                </tr>

                <tr>
                <td>address</td>
                <td>{{user.address}}</td>
                </tr>
                <tr>
                    <td>contact</td>
                <td>{{user.contact}}</td>
                </tr>
                <tr> 
                <td colspan="2" align="center"><a href="{% url 'webuser:EditProfile' %}">edit profile</a>
                    <a href="{% url 'webuser:changepass' %}">Change password</a></td>
                
           </tr>
           </table>
        
        </form>
    </center>
</body>
</html>
{% endblock content %}
