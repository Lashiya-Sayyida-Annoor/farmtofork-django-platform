<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings</title>
</head>
<body>
    <h2>My Bookings</h2>
    <table border="1" cellpadding="10">
        <tr>
            <th>Booking Date</th>
            <th>Status</th>
            <th>Total Price</th>
            <th>Action</th>
        </tr>
        {% for i in complist %}
        <tr>
            <td>{{ i.data.booking_date }}</td>
            <td>
                {% if i.data.booking_status == 1 %}
                Payed
                {% else %}
                Not Payed
                {% endif %}
            </td>
            <td>{{ i.total }}</td>
            <td><a href="{% url 'webuser:myproduct' i.id %}" class="btn btn-primary"> View Product </a> | <a href="{% url 'webuser:bills' i.id %}">Bill</a></td>

        </tr>
        {% endfor %}
    </table>
</body>
</html>
