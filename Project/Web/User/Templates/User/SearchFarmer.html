{% extends 'User/Header.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
        }
        .sub {
            padding: 15px;
            background-color: #C8E6C9;
            width: fit-content;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .loader {
            color: green;
            font-size: 10px;
            width: 1em;
            height: 1em;
            border-radius: 50%;
            position: relative;
            text-indent: -9999em;
            animation: mulShdSpin 1.3s infinite linear;
            transform: translateZ(0);
            }
            .search {
    display: flex;
    flex-direction: column;
    align-items: center; /* Center the items horizontally */
}
.search div {
    margin-bottom: 10px; /* Add some space between the dropdowns */
}

            @keyframes mulShdSpin {
            0%,
            100% {
                box-shadow: 0 -3em 0 0.2em, 
                2em -2em 0 0em, 3em 0 0 -1em, 
                2em 2em 0 -1em, 0 3em 0 -1em, 
                -2em 2em 0 -1em, -3em 0 0 -1em, 
                -2em -2em 0 0;
            }
            12.5% {
                box-shadow: 0 -3em 0 0, 2em -2em 0 0.2em, 
                3em 0 0 0, 2em 2em 0 -1em, 0 3em 0 -1em, 
                -2em 2em 0 -1em, -3em 0 0 -1em, 
                -2em -2em 0 -1em;
            }
            25% {
                box-shadow: 0 -3em 0 -0.5em, 
                2em -2em 0 0, 3em 0 0 0.2em, 
                2em 2em 0 0, 0 3em 0 -1em, 
                -2em 2em 0 -1em, -3em 0 0 -1em, 
                -2em -2em 0 -1em;
            }
            37.5% {
                box-shadow: 0 -3em 0 -1em, 2em -2em 0 -1em,
                3em 0em 0 0, 2em 2em 0 0.2em, 0 3em 0 0em, 
                -2em 2em 0 -1em, -3em 0em 0 -1em, -2em -2em 0 -1em;
            }
            50% {
                box-shadow: 0 -3em 0 -1em, 2em -2em 0 -1em,
                3em 0 0 -1em, 2em 2em 0 0em, 0 3em 0 0.2em, 
                -2em 2em 0 0, -3em 0em 0 -1em, -2em -2em 0 -1em;
            }
            62.5% {
                box-shadow: 0 -3em 0 -1em, 2em -2em 0 -1em,
                3em 0 0 -1em, 2em 2em 0 -1em, 0 3em 0 0, 
                -2em 2em 0 0.2em, -3em 0 0 0, -2em -2em 0 -1em;
            }
            75% {
                box-shadow: 0em -3em 0 -1em, 2em -2em 0 -1em, 
                3em 0em 0 -1em, 2em 2em 0 -1em, 0 3em 0 -1em, 
                -2em 2em 0 0, -3em 0em 0 0.2em, -2em -2em 0 0;
            }
            87.5% {
                box-shadow: 0em -3em 0 0, 2em -2em 0 -1em, 
                3em 0 0 -1em, 2em 2em 0 -1em, 0 3em 0 -1em, 
                -2em 2em 0 0, -3em 0em 0 0, -2em -2em 0 0.2em;
            }
            }
            .load_div {
                display: none;
                position: absolute;
                width: 100%;
                height: 100vh;
                background-color: #a5d6a72b;
                left: 0;
                top: 0;
                backdrop-filter: blur(7px);
                justify-content: center;
                align-items: center;
            }
    </style>
</head>
<body>
    <div class="load_div" id="load">
        <span class="loader"></span>
    </div>
    <label for="district">District:</label>
        <select id="district" name="district">
            <option value="">Select District</option>
            {% for i in district %}
            <option value="{{i.id}}">{{i.district.district_name}}</option>
            {% endfor %}
        </select>
        
        <label for="place">Place:</label>
        <select id="place" name="place">
            <option value="">Select Place</option>
            <!-- Populate options dynamically using JavaScript or server-side rendering -->
        </select>

        <div class="main" id="result">
            {% for i in farmer %}
            <div class="sub">
                <div><img src="{{i.farmer.farmer_photo}}" width="150" height="150" alt=""></div>
                <div>Name :{{ i.farmer.farmer_name }}</div>
                <div>Contact :{{ i.farmer.farmer_contact }}</div>
                <div>Email :{{ i.farmer.farmer_email }}</div>
                <div><a href="{% url 'webuser:searchveg' i.id %}">View more</a></div>
            </div>
            {% endfor %}
        </div>
</body>
</html>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $("#district").change(function () {
        var did = $(this).val();
        var pid = document.getElementById("place").value
        var ur = "{% url 'webGuest:ajaxplace' %}"
        document.getElementById("load").style.display = "flex"
        $.ajax({
            url: ur,
            data: { did: did, },
            success: function (data) {
                $("#place").html(data);
                var ur = "{% url 'webuser:ajaxfarmer' %}"
                $.ajax({
                    url: ur,
                    data: { pid: pid,did: did, },
                    success: function (data) {
                        $("#result").html(data);
                        document.getElementById("load").style.display = "none"
                    },
                });
            },
        });
    });

    $("#place").change(function () {
        var pid = $(this).val();
        var did = document.getElementById("district").value
        var ur = "{% url 'webuser:ajaxfarmer' %}"
        document.getElementById("load").style.display = "flex"
        $.ajax({
            url: ur,
            data: { pid: pid,did: did, },
            success: function (data) {
                $("#result").html(data);
                document.getElementById("load").style.display = "none"
            },
        });
    });
</script>
{% endblock content %}
